{% extends 'appeals/base.html' %}
{% block title %}Удалить обращение{% endblock %}
{% block page_title %}Удаление обращения{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-header text-danger">
                <i class="bi bi-exclamation-triangle me-1"></i> Подтверждение удаления
            </div>
            <div class="card-body text-center py-4">
                <i class="bi bi-trash3 text-danger" style="font-size:3rem"></i>
                <h5 class="mt-3">Удалить обращение?</h5>
                <p class="text-muted">
                    <strong>{{ appeal.full_name }}</strong><br>
                    Это действие необратимо.
                </p>
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <form action="{% url 'delete_appeal' appeal.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                    </form>
                    <a href="{% url 'appeal_detail' appeal.id %}" class="btn btn-outline-secondary px-4">Отмена</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
